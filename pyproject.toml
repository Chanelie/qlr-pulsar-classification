[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlr-pulsar-classification"
version = "0.1.0rc1"
description = "Hybrid quantum-classical logistic regression for HTRU2 pulsar candidates"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "Chanelle Matadah Manfouo"}]
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "pennylane==0.42.3",
  "pennylane-lightning==0.42.0",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "xgboost==3.2.0",
  "matplotlib",
  "seaborn",
  "psutil",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
include = ["qlr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
